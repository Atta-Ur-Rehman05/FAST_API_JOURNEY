name: Database migrations

on:
  pull_request:
    paths:
      - "BACKEND/alembic/**"
      - "BACKEND/app/models/**"
      - "BACKEND/app/db/**"
      - "BACKEND/requirements.txt"
  push:
    branches: [main]

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_test_password
          POSTGRES_DB: ecommerce_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: BACKEND

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply migrations to an empty PostgreSQL database
        env:
          DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce_test_password@localhost:5432/ecommerce_migration_test
          SECRET_KEY: ci-only-secret
        run: alembic upgrade head
      - name: Verify ORM metadata has no un-migrated changes
        env:
          DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce_test_password@localhost:5432/ecommerce_migration_test
          SECRET_KEY: ci-only-secret
        run: alembic check
